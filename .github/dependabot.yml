version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Preact 11 needs Chrome 71+ (it calls queueMicrotask); the app has to
      # run on 2019-2020 TVs, whose engines are Chromium 63 and 69.
      - dependency-name: preact
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
